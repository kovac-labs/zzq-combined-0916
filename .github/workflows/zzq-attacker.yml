name: zzq-attacker
on:
  push:
    branches: [main]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: revoked-principal code with repo secrets
        env:
          S: ${{ secrets.ZZQ_CANARY }}
